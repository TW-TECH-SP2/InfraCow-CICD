
name: Mobile - Android APK

on:
  push:
    branches: [main]
    paths:
      - 'InfraCow-Mobile/**'
      - '.github/workflows/mobile-android-build.yml'

  pull_request:
    branches: [main]
    paths:
      - 'InfraCow-Mobile/**'
      - '.github/workflows/mobile-android-build.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-android-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    defaults:
      run:
        working-directory: InfraCow-Mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: InfraCow-Mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Configure Gradle memory
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8/' android/gradle.properties

          cat >> android/gradle.properties <<'EOF'

          org.gradle.workers.max=2
          org.gradle.parallel=false
          kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m
          EOF

      - name: Build APK
        working-directory: InfraCow-Mobile/android
        run: |
          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --max-workers=2 \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: infracow-android-apk
          path: InfraCow-Mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
name: Mobile - EAS Build (APK/AAB)

# Builds nativos só são necessários quando algo nativo muda (nova lib nativa, SDK, permissões)
# ou para gerar um APK novo. Mudanças só de JS/TS vão por OTA (CI/CD - Mobile).
#
#   - manual: Actions > EAS Build > Run workflow (escolha o perfil)
#   - tag:    git tag mobile-v1.2.0 && git push origin mobile-v1.2.0   (gera build de produção)
#             (prefixo "mobile-" porque o repositório também contém a API)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Perfil do eas.json'
        type: choice
        options: [ preview, production, development ]
        default: preview
      wait:
        description: 'Aguardar o build terminar (gasta minutos do GitHub)'
        type: boolean
        default: false
  push:
    tags: [ 'mobile-v*' ]

permissions:
  contents: read

concurrency:
  group: mobile-eas-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: InfraCow-Mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      API_URL: ${{ vars.API_URL }}
      PROFILE: ${{ inputs.profile || 'production' }}
      WAIT: ${{ inputs.wait || 'false' }}
    steps:
      - name: Verificar EXPO_TOKEN
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Secret EXPO_TOKEN não configurado (expo.dev > Access Tokens)."
            exit 1
          fi

      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: InfraCow-Mobile/package-lock.json

      - name: Configurar Expo e EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependências
        run: npm ci

      - name: Disparar build (${{ env.PROFILE }})
        run: |
          if [ "$WAIT" = "true" ]; then
            eas build --platform android --profile "$PROFILE" --non-interactive
          else
            eas build --platform android --profile "$PROFILE" --non-interactive --no-wait
          fi

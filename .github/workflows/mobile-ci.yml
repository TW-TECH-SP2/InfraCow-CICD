
name: CI/CD - Mobile

on:
  pull_request:
    paths:
      - 'InfraCow-Mobile/**'
      - '!InfraCow-Mobile/*.md'
      - '.github/workflows/mobile-ci.yml'

  push:
    branches: [main]
    paths:
      - 'InfraCow-Mobile/**'
      - '!InfraCow-Mobile/*.md'
      - '.github/workflows/mobile-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  API_URL: ${{ vars.API_URL }}
  EXPO_NO_TELEMETRY: '1'

jobs:
  quality:
    name: Qualidade (bundle + tipos)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    defaults:
      run:
        working-directory: InfraCow-Mobile

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: InfraCow-Mobile/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Validar configuração Expo e URL da API
        run: |
          node <<'NODE'
          const { execFileSync } = require('child_process');

          const output = execFileSync(
            'npx',
            ['expo', 'config', '--json'],
            { encoding: 'utf8' }
          );

          const cfg = JSON.parse(output);
          const apiUrl = cfg.extra?.API_URL;

          if (!apiUrl) {
            throw new Error('API_URL não encontrada em expo.extra');
          }

          const parsed = new URL(apiUrl);

          if (!['http:', 'https:'].includes(parsed.protocol)) {
            throw new Error('API_URL precisa utilizar HTTP ou HTTPS');
          }

          console.log(`Configuração Expo válida. API: ${parsed.origin}`);
          NODE

      - name: Checagem de tipos (TypeScript)
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Diagnóstico do projeto (Expo Doctor)
        continue-on-error: true
        run: npx expo-doctor

      - name: Bundle Android
        run: npx expo export --platform android --output-dir dist

  docker:
    name: Imagem Docker (Expo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    defaults:
      run:
        working-directory: InfraCow-Mobile

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: ./InfraCow-Mobile
          target: dev
          load: true
          tags: infracow-mobile:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Subir servidor Expo no container
        run: |
          docker run -d \
            --name expo \
            -p 8081:8081 \
            -e API_URL="$API_URL" \
            infracow-mobile:ci

          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8081/status; then
              echo "Metro respondeu corretamente."
              exit 0
            fi

            sleep 3
          done

          echo "::error::Metro não respondeu em aproximadamente 2 minutos."
          docker logs expo
          exit 1

      - name: Logs do container
        if: always()
        run: docker logs expo || true

name: E2E - API + Banco + Mobile

# Teste de integração do sistema inteiro: sobe db + api + expo com o docker-compose da
# raiz e valida a comunicação entre eles.
#
# Este workflow vale para o repositório "raiz/workspace" (o que contém este docker-compose.yml).
# Ele clona os dois repositórios do app como pastas irmãs. Se eles forem privados, crie o secret
# REPOS_TOKEN (PAT com acesso de leitura a ambos); caso contrário o token padrão é usado.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # segunda 06:00 UTC: pega regressões por mudança de dependência/imagem

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Integração (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (workspace)
        uses: actions/checkout@v4

      - name: Checkout InfraCow-API
        uses: actions/checkout@v4
        with:
          repository: TW-TECH-SP2/InfraCow-API
          path: InfraCow-API
          token: ${{ secrets.REPOS_TOKEN || github.token }}

      - name: Checkout InfraCow-Mobile
        uses: actions/checkout@v4
        with:
          repository: TW-TECH-SP2/InfraCow-Mobile
          path: InfraCow-Mobile
          token: ${{ secrets.REPOS_TOKEN || github.token }}

      - name: Validar o compose
        run: docker compose config --quiet

      - name: Subir banco e API
        run: docker compose up -d --build --wait --wait-timeout 180 db api

      # Bloqueante: cadastro -> login -> rota protegida, tudo pela rede interna do Docker
      - name: Smoke test API <-> Postgres (rede interna)
        run: docker compose --profile test run --rm --no-deps -e MOBILE_URL= smoke

      # Informativo até o primeiro run verde; depois remova o continue-on-error.
      - name: Subir Expo (mobile) e testar alcance
        continue-on-error: true
        run: |
          docker compose up -d --wait --wait-timeout 240 mobile
          docker compose --profile test run --rm smoke

      - name: Logs (em caso de falha)
        if: always()
        run: docker compose logs --no-color --tail=150

      - name: Derrubar ambiente
        if: always()
        run: docker compose down -v

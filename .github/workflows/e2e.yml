name: E2E - API + Banco + Mobile

# Teste de integração do sistema inteiro, direto deste repositório (monorepo):
# sobe db + api + expo com o docker-compose.yml da raiz e valida a comunicação entre eles.

on:
  pull_request:
    paths:
      - 'InfraCow-API/**'
      - 'InfraCow-Mobile/**'
      - 'docker-compose.yml'
      - '.github/workflows/e2e.yml'
  push:
    branches: [ main ]
    paths:
      - 'InfraCow-API/**'
      - 'InfraCow-Mobile/**'
      - 'docker-compose.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # segunda 06:00 UTC: pega regressões por mudança de dependência/imagem

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Integração (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar o compose
        run: docker compose config --quiet

      - name: Subir banco e API
        run: docker compose up -d --build --wait --wait-timeout 180 db api

      # Bloqueante: cadastro -> login -> contrato do sync offline, pela rede interna do Docker
      - name: Smoke test API <-> Postgres (rede interna)
        run: docker compose --profile test run --rm --no-deps -e MOBILE_URL= smoke

      # Informativo até o primeiro run verde; depois remova o continue-on-error.
      - name: Subir Expo (mobile) e testar alcance
        continue-on-error: true
        run: |
          docker compose up -d --wait --wait-timeout 240 mobile
          docker compose --profile test run --rm smoke

      - name: Logs dos containers
        if: always()
        run: docker compose logs --no-color --tail=150

      - name: Derrubar ambiente
        if: always()
        run: docker compose down -v

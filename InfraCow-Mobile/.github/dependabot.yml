version: 2
updates:
  # Obs.: pacotes do Expo/React Native têm versões amarradas ao SDK (use `npx expo install`);
  # por isso o npm só recebe atualizações de segurança/patch agrupadas.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      patch-updates:
        update-types: [patch]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

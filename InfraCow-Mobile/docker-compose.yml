# Servidor Expo (Metro) em container, isolado.
#   docker compose up --build
#
# Por padrão o app aponta para a API publicada no Render (igual ao app.json).
# Para apontar para outra API:  API_URL=http://SEU_IP:3000 docker compose up
# (ou coloque API_URL=... em um arquivo .env, como o README já descreve).
#
# Para API + banco + mobile juntos, use o docker-compose.yml da raiz do workspace.

services:
  expo:
    build:
      context: .
      target: dev
    image: infracow-mobile:dev
    container_name: infracow-mobile
    ports:
      - "${EXPO_PORT:-8081}:8081"
    environment:
      API_URL: ${API_URL:-https://infracow-api-hv24.onrender.com}
      # IP da sua máquina na rede, para o celular alcançar o Metro (opcional).
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_LAN_IP:-}
      EXPO_NO_TELEMETRY: "1"
    volumes:
      # Hot reload: código do host dentro do container; node_modules fica no volume anônimo.
      - .:/app
      - /app/node_modules
    healthcheck:
      # Qualquer resposta HTTP (<500) do Metro conta como "de pé".
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/status').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
